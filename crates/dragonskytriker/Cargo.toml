[package]
name = "dragonskytriker"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DragonSkyTriker : SDK de drones avec Bevy, au design épuré."
rust-version = "1.95"
default-run = "dragonskytriker"

[lib]
name = "dragonskytriker"
path = "src/lib.rs"

[[bin]]
name = "dragonskytriker"
path = "src/main.rs"

[dependencies]
dragonskytriker-core = { path = "../dragonskytriker-core", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bevy = { version = "0.19", default-features = false, features = ["3d", "ui"] }
