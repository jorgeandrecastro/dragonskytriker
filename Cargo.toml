[workspace]
resolver = "2"
members = [
    "crates/tiny-rodriguez-nostd",
    "crates/dragonskytriker-core",
    "crates/dragonskytriker",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"

# Les dépendances (Bevy) sont optimisées même en debug : la simulation reste fluide.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
