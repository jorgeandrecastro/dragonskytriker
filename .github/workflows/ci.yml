name: Release

on:
  push:
    tags:
      - 'v*' # Se déclenche à chaque création de tag commençant par 'v' (ex: v0.1)

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-release:
    name: Build & Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: dragonskytriker-linux-x86_64
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: dragonskytriker-macos-aarch64
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: dragonskytriker-windows-x86_64.exe
            archive: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & build artifacts
        uses: swatinem/rust-cache@v2

      - name: Build release binary & headless example
        run: |
          cargo build --release -p dragonskytriker
          cargo build --release -p dragonskytriker-core --example headless

      - name: Prepare artifact directory
        shell: bash
        run: |
          mkdir -p release_staging
          # Copier les exécutables selon l'OS
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/dragonskytriker.exe release_staging/
            cp target/release/examples/headless.exe release_staging/
          else
            cp target/release/dragonskytriker release_staging/
            cp target/release/examples/headless release_staging/
          fi
          # Copier les assets nécessaires (mondes JSON, etc.) s'ils existent
          if [ -d "assets" ]; then
            cp -r assets release_staging/
          fi

      - name: Archive binary (Tar)
        if: matrix.archive == 'tar.gz'
        run: |
          tar -czvf ${{ matrix.artifact_name }}.tar.gz -C release_staging .

      - name: Archive binary (Zip)
        if: matrix.archive == 'zip'
        run: |
          Compress-Archive -Path release_staging\* -DestinationPath ${{ matrix.artifact_name }}.zip

      - name: Upload binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}